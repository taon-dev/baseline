<taon-admin-layout
  [routes]="adminRoutes"
  [outlet]="outlet"
  basePath="/backoffice">
  <div
    header
    class="flex h-16 items-center px-6">
    @if (appHeader()) {
      <ng-container [ngTemplateOutlet]="appHeader()" />
    } @else {
      <span> Application Title</span>
    }
  </div>

  <div
    asideFooter
    class="text-xs text-gray-500">
    @if (appBottomLeftMenuFooter()) {
      <ng-container [ngTemplateOutlet]="appBottomLeftMenuFooter()" />
    } @else {
      <span> Taon Admin v1.0</span>
    }
  </div>

</taon-admin-layout>
